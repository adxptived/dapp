name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          mkdir -p /tmp/out
          flutter --version > /tmp/out/version.txt 2>&1
          cd /tmp && flutter create --org com.adxptived --project-name dapp --platforms android,ios gen > /tmp/out/create.txt 2>&1
          cd gen
          for f in android/app/build.gradle.kts android/settings.gradle.kts android/build.gradle.kts android/gradle.properties android/gradle/wrapper/gradle-wrapper.properties android/app/src/main/AndroidManifest.xml pubspec.yaml; do echo "=== $f"; cat $f; done > /tmp/out/templates.txt 2>&1
          find . -type f -not -path './.dart_tool/*' | sort > /tmp/out/files.txt
          flutter pub add http path_provider provider google_fonts url_launcher package_info_plus open_filex file_picker flutter_local_notifications workmanager > /tmp/out/pubadd.txt 2>&1 || true
          cat pubspec.yaml >> /tmp/out/pubadd.txt
          PC=$HOME/.pub-cache/hosted/pub.dev
          ls $PC > /tmp/out/pkgs.txt
          {
          echo "=== FLN"; grep -n "Future<.*> \(initialize\|show\|cancel\)\b\|^  Future<bool?> initialize\|required\|^    [A-Za-z].*,$" $PC/flutter_local_notifications-*/lib/src/flutter_local_notifications_plugin.dart | head -120
          echo "=== FLN android requestNotificationsPermission"; grep -rn "requestNotificationsPermission\|class AndroidNotificationDetails\|AndroidNotificationDetails(" $PC/flutter_local_notifications-*/lib/src/platform_flutter_local_notifications.dart $PC/flutter_local_notifications-*/lib/src/platform_specifics/android/notification_details.dart | head -20
          sed -n '/AndroidNotificationDetails(/,/});/p' $PC/flutter_local_notifications-*/lib/src/platform_specifics/android/notification_details.dart | head -60
          echo "=== FLN android setup README"; grep -n -i -A3 "desugar\|compileSdk" $PC/flutter_local_notifications-*/README.md | head -60
          echo "=== WM"; grep -n "Future<.*>\|void executeTask\|static" $PC/workmanager-*/lib/src/workmanager*.dart $PC/workmanager/lib/*.dart 2>/dev/null | head -60
          ls $PC | grep -i workmanager
          for d in $PC/workmanager*; do echo "--$d"; ls $d/lib $d/lib/src 2>/dev/null; done
          grep -rn "registerPeriodicTask\|Future<void> initialize\|executeTask" $PC/workmanager*/lib | head -20
          echo "=== FP"; grep -rn "Future<String?> saveFile\|Future<FilePickerResult?> pickFiles" -A16 $PC/file_picker-*/lib/src/file_picker.dart | head -60
          echo "=== OF"; grep -rn "static Future<OpenResult> open" -A6 $PC/open_filex-*/lib/src/*.dart | head
          echo "=== GF"; grep -n "static TextTheme manropeTextTheme\|static TextStyle manrope(" $PC/google_fonts-*/lib/src/google_fonts_parts/*.dart | head -4
          echo "=== PIP"; grep -n "buildNumber\|static Future<PackageInfo> fromPlatform" $PC/package_info_plus-*/lib/package_info_plus.dart | head
          echo "=== UL"; grep -n "^Future<bool> launchUrl" -A6 $PC/url_launcher-*/lib/src/url_launcher_uri.dart | head
          } > /tmp/out/apis.txt 2>&1
      - if: always()
        run: |
          cd /tmp/out
          git init -q; git config user.name ci; git config user.email ci@e.com
          git checkout -q -b ci-logs; git add -A; git commit -qm "probe logs"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs
