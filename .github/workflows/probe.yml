name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          mkdir -p /tmp/out
          flutter --version > /tmp/out/version.txt 2>&1
          cd /tmp && flutter create --org com.adxptived --project-name dapp --platforms android,ios gen > /tmp/out/create.txt 2>&1
          cd gen
          for f in android/app/build.gradle.kts android/settings.gradle.kts android/build.gradle.kts android/gradle.properties android/gradle/wrapper/gradle-wrapper.properties android/app/src/main/AndroidManifest.xml pubspec.yaml; do echo "=== $f"; cat $f; done > /tmp/out/templates.txt 2>&1
          find . -type f -not -path './.dart_tool/*' | sort > /tmp/out/files.txt
          flutter pub add http path_provider provider google_fonts url_launcher package_info_plus open_filex file_picker flutter_local_notifications workmanager > /tmp/out/pubadd.txt 2>&1 || true
          cat pubspec.yaml >> /tmp/out/pubadd.txt
          set +e
          PC=$HOME/.pub-cache/hosted/pub.dev
          {
          echo "=== WM"; sed -n '165,380p' $PC/workmanager-*/lib/src/workmanager_impl.dart
          echo "=== FP"; ls $PC | grep file_picker; grep -rn "saveFile\|Future<FilePickerResult?> pickFiles" $PC/file_picker-*/lib/src/*.dart | head; grep -rn "Future<String?> saveFile" -A16 $PC/file_picker-*/lib/src/ | head -40; grep -rn "Future<FilePickerResult?> pickFiles" -A20 $PC/file_picker-*/lib/src/file_picker.dart | head -30
          echo "=== OF"; grep -rn "static Future<OpenResult> open" -A8 $PC/open_filex-*/lib/ | head -20
          echo "=== GF"; grep -rln "manropeTextTheme" $PC/google_fonts-*/lib | head -3; grep -rn "static TextTheme manropeTextTheme\|TextStyle manrope(" $PC/google_fonts-*/lib | head -4
          echo "=== PIP"; grep -rn "buildNumber\|Future<PackageInfo> fromPlatform" $PC/package_info_plus-*/lib/package_info_plus.dart | head
          echo "=== UL"; grep -rn "Future<bool> launchUrl" -A6 $PC/url_launcher-*/lib/src/ | head -12
          echo "=== PP"; ls $PC | grep -E "^(http|path_provider|provider)-"
          } > /tmp/out/apis2.txt 2>&1
          true
      - if: always()
        run: |
          cd /tmp/out
          git init -q; git config user.name ci; git config user.email ci@e.com
          git checkout -q -b ci-logs; git add -A; git commit -qm "probe logs"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs
